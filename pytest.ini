[pytest]
# Pytest configuration for CMMC Watch

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Markers for categorizing tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests (require network/APIs)
    unit: marks tests as unit tests (fast, no external dependencies)

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --cov=scripts
    --cov-report=term-missing

# Coverage reporting is enabled above (report-only on purpose: no --cov-fail-under
# here, so running a subset of tests locally never fails on low aggregate coverage).
# The hard floor is enforced in CI (.github/workflows/tests.yml) where the full
# suite always runs. Current total ~58%; target is 80% (raise the CI floor as the
# big gaps shrink: editorial_generator, generate_design, fetch_images, tools/).

# Minimum Python version
minversion = 3.10
